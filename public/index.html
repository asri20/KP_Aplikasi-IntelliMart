<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliMart - Purchase Order Tester</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
    .header { background: #007bff; color: white; padding: 15px 20px; font-size: 1.5em; font-weight: bold; text-align: center; }
    .content { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .danger { background: #dc3545; }
    .danger:hover { background: #c82333; }
    .items-container { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-top: 10px; }
    .response, .list { margin-top: 10px; padding: 15px; border-radius: 8px; background: #f8f9fa; max-height: 500px; overflow-y: auto; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f1f1f1; }
    .actions button { margin-right: 5px; padding: 6px 10px; font-size: 0.9em; }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">IntelliMart - Purchase Order Tester</div>
  <div class="content">

    <!-- FORM CREATE -->
    <div>
      <h2>Buat Purchase Order Baru</h2>
      <form id="poForm">
        <div class="form-group"><label>Store ID</label><input type="number" id="store_id" value="1" required></div>
        <div class="form-group"><label>Supplier ID</label><input type="number" id="supplier_id" value="3" required></div>
        <div class="form-group"><label>User ID</label><input type="number" id="user_id" value="1" required></div>
        <div class="form-group"><label>Expected Delivery Date</label><input type="date" id="expected_delivery_date"></div>
        <div class="form-group"><label>Notes</label><textarea id="notes" rows="2"></textarea></div>

        <h3>Items</h3>
        <div class="items-container" id="itemsContainer"></div>
        <button type="button" onclick="addItem()" style="margin-top:10px;">+ Tambah Item</button>

        <br><br>
        <button type="submit" style="width:100%; padding:15px; font-size:1.1em;">Submit Purchase Order</button>
      </form>
      <div id="response" class="response"></div>
    </div>

    <!-- LIST PO -->
    <div>
      <h2>Daftar Purchase Order</h2>
      <div style="margin-bottom:10px;">
        <label>Filter Status: </label>
        <select id="statusFilter" onchange="loadPOs()">
          <option value="">Semua</option>
          <option value="draft">Draft</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="received">Received</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button onclick="loadPOs()" style="margin-left:10px;">🔄 Refresh</button>
      </div>
      <div id="poList" class="list"></div>
    </div>

  </div>
</div>

<!-- MODAL EDIT PO -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h2>Edit Purchase Order</h2>
    <form id="editForm">
      <input type="hidden" id="edit_po_id">
      
      <div class="form-group">
        <label>PO Number</label>
        <input type="text" id="edit_po_number" readonly>
      </div>
      <div class="form-group">
        <label>Supplier ID</label>
        <input type="number" id="edit_supplier_id">
      </div>
      <div class="form-group">
        <label>Expected Delivery Date</label>
        <input type="date" id="edit_expected_date">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="edit_notes" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="edit_status">
          <option value="draft">Draft</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="received">Received</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <button type="submit">Simpan Perubahan</button>
      <button type="button" onclick="closeModal()" style="background:#6c757d; margin-left:10px;">Batal</button>
    </form>
  </div>
</div>

<script>
  let itemCount = 0;

  function addItem() {
    itemCount++;
    const container = document.getElementById('itemsContainer');
    const div = document.createElement('div');
    div.innerHTML = `
      <div style="border:1px solid #ddd; padding:12px; margin-bottom:10px; border-radius:6px;">
        <label>Variant ID</label><input type="number" class="variant_id" value="1" required>
        <label>Quantity</label><input type="number" class="quantity" value="10" required>
        <label>Unit Price</label><input type="number" class="unit_price" value="85000" required>
      </div>`;
    container.appendChild(div);
  }

  window.onload = () => { addItem(); loadPOs(); };

  // Submit Create PO
  document.getElementById('poForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const items = Array.from(document.querySelectorAll('.items-container > div')).map(div => ({
      variant_id: parseInt(div.querySelector('.variant_id').value),
      quantity: parseInt(div.querySelector('.quantity').value),
      unit_price: parseFloat(div.querySelector('.unit_price').value)
    }));

    const data = {
      store_id: parseInt(document.getElementById('store_id').value),
      supplier_id: parseInt(document.getElementById('supplier_id').value),
      user_id: parseInt(document.getElementById('user_id').value),
      expected_delivery_date: document.getElementById('expected_delivery_date').value || null,
      notes: document.getElementById('notes').value,
      items: items
    };

    const responseDiv = document.getElementById('response');
    try {
      const res = await fetch('http://localhost:5000/api/purchase-orders', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
      });
      const result = await res.json();
      if (res.ok) {
        responseDiv.className = 'response success';
        responseDiv.innerHTML = `<strong>✅ Berhasil!</strong><br><pre>${JSON.stringify(result, null, 2)}</pre>`;
        loadPOs();
      } else {
        responseDiv.className = 'response error';
        responseDiv.innerHTML = `<strong>❌ Gagal</strong><br>${result.message || JSON.stringify(result)}`;
      }
    } catch (err) {
      responseDiv.className = 'response error';
      responseDiv.innerHTML = `<strong>❌ Error</strong><br>${err.message}`;
    }
  });

  // Load PO List
  async function loadPOs() {
    const filter = document.getElementById('statusFilter').value;
    const listDiv = document.getElementById('poList');
    listDiv.innerHTML = '<p>Memuat data...</p>';

    try {
      let url = 'http://localhost:5000/api/purchase-orders';
      if (filter) url += `?status=${filter}`;

      const res = await fetch(url);
      const result = await res.json();

      if (result.success && result.data && result.data.length > 0) {
        let html = `<table><tr><th>PO Number</th><th>Supplier</th><th>Total</th><th>Status</th><th>Tanggal</th><th>Actions</th></tr>`;
        
        result.data.forEach(po => {
          html += `
            <tr>
              <td>${po.po_number}</td>
              <td>${po.supplier ? po.supplier.supplier_name : '-'}</td>
              <td>Rp ${parseFloat(po.total_amount || 0).toLocaleString('id-ID')}</td>
              <td><strong>${po.status}</strong></td>
              <td>${new Date(po.order_date).toLocaleDateString('id-ID')}</td>
              <td class="actions">
                <button onclick="editPO(${po.po_id})">✏ Edit</button>
                <button onclick="viewDetail(${po.po_id})">👁 Detail</button>
                <button class="danger" onclick="deletePO(${po.po_id})">🗑 Delete</button>
              </td>
            </tr>`;
        });
        html += `</table>`;
        listDiv.innerHTML = html;
      } else {
        listDiv.innerHTML = '<p>Belum ada Purchase Order.</p>';
      }
    } catch (err) {
      listDiv.innerHTML = `<p style="color:red;">Gagal memuat: ${err.message}</p>`;
    }
  }

  // Edit PO
  async function editPO(id) {
    try {
      const res = await fetch(`http://localhost:5000/api/purchase-orders/${id}`);
      const result = await res.json();
      if (!result.success) return alert('Gagal mengambil data PO');

      const po = result.data;
      document.getElementById('edit_po_id').value = po.po_id;
      document.getElementById('edit_po_number').value = po.po_number;
      document.getElementById('edit_supplier_id').value = po.supplier_id || '';
      document.getElementById('edit_expected_date').value = po.expected_delivery_date ? po.expected_delivery_date.split('T')[0] : '';
      document.getElementById('edit_notes').value = po.notes || '';
      document.getElementById('edit_status').value = po.status;

      document.getElementById('editModal').style.display = 'flex';
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  // Submit Edit
  document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('edit_po_id').value;
    const data = {
      supplier_id: parseInt(document.getElementById('edit_supplier_id').value),
      expected_delivery_date: document.getElementById('edit_expected_date').value || null,
      notes: document.getElementById('edit_notes').value,
      status: document.getElementById('edit_status').value
    };

    try {
      const res = await fetch(`http://localhost:5000/api/purchase-orders/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (res.ok) {
        alert('✅ Purchase Order berhasil diupdate!');
        closeModal();
        loadPOs();
      } else {
        alert(result.message || 'Gagal mengupdate PO');
      }
    } catch (err) {
      alert('Error: ' + err.message);
    }
  });

  function closeModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  // View Detail & Delete (sama seperti sebelumnya)
  async function viewDetail(id) {
    try {
      const res = await fetch(`http://localhost:5000/api/purchase-orders/${id}`);
      const result = await res.json();
      alert(JSON.stringify(result, null, 2));
    } catch (err) {
      alert('Gagal mengambil detail');
    }
  }

  async function deletePO(id) {
    if (!confirm('Yakin ingin menghapus PO ini?')) return;
    try {
      const res = await fetch(`http://localhost:5000/api/purchase-orders/${id}`, { method: 'DELETE' });
      if (res.ok) {
        alert('PO berhasil dihapus');
        loadPOs();
      } else {
        alert('Gagal menghapus PO');
      }
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }
</script>
</body>
</html>
